<!-- 1. Importation de Tailwind CSS et Lucide Icons -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<!-- 2. Styles encapsulés -->
<style>
    @font-face {
        font-family: 'Avenir';
        src: local('Avenir'), local('Avenir-Light');
    }
    #papernest-edf-tool {
        font-family: 'Avenir', system-ui, -apple-system, sans-serif;
        background-color: transparent;
        width: 100%;
        /* On retire overflow: hidden pour permettre au menu de ne pas être coupé si besoin */
        display: flow-root; 
    }
    #papernest-edf-tool .hide-element { 
        display: none !important; 
    }
    #papernest-edf-tool #dropdown-menu::-webkit-scrollbar {
        width: 6px;
    }
    #papernest-edf-tool #dropdown-menu::-webkit-scrollbar-thumb {
        background-color: #E7E5E4;
        border-radius: 10px;
    }
    /* Animation fluide pour l'apparition de la description */
    #desc-container {
        transition: all 0.3s ease-out;
    }
</style>

<!-- 3. Structure de l'outil (HTML) -->
<div id="papernest-edf-tool" class="text-[#1C1917] antialiased">
    <div class="flex flex-col items-center justify-center py-2 w-full">
        
        <!-- Main Title -->
        <h1 class="text-lg md:text-xl font-bold mb-6 text-center tracking-tight">
            Trouvez votre offre d'électricité EDF
        </h1>

        <!-- Main Card -->
        <div class="bg-white rounded-[24px] w-full max-w-4xl border border-[#E7E5E4] p-6 md:p-10 shadow-sm mx-auto">
            
            <p class="text-[#57534D] text-sm md:text-base mb-8 text-left">
                Consultez les détails de chaque offre d'électricité, pour particuliers ou professionnels, et trouvez celle qui correspond le mieux à vos besoins.
            </p>

            <!-- Form Body -->
            <div class="mb-8 relative" id="dropdown-container">
                <label class="block text-sm font-semibold mb-3">
                    Sélectionnez une offre
                </label>
                
                <!-- Custom Select Box -->
                <div id="select-btn" class="w-full bg-[#F6F5FF] border border-[#CECCFF] hover:border-[#5A52FF] text-sm py-3 px-4 rounded-xl transition-all font-medium cursor-pointer flex items-center justify-between">
                    <div class="flex items-center gap-3 truncate pr-4">
                        <span id="select-icon" class="text-[#5A52FF] flex-shrink-0 flex items-center justify-center w-4 h-4">
                            <i data-lucide="layout-list" class="w-4 h-4"></i>
                        </span>
                        <span id="select-text" class="text-[#5A52FF] font-semibold truncate">Sélectionnez une offre...</span>
                    </div>
                    <i data-lucide="chevron-down" id="select-chevron" class="w-4 h-4 text-[#5A52FF] flex-shrink-0 transition-transform duration-200"></i>
                </div>

                <!-- Dropdown Options -->
                <div id="dropdown-menu" class="hide-element absolute z-50 w-full mt-2 bg-white border border-[#E7E5E4] rounded-xl shadow-lg max-h-[280px] overflow-y-auto py-2">
                    <!-- Les options seront injectées ici par JavaScript -->
                </div>
            </div>

            <!-- Offer Description Area -->
            <div id="desc-container" class="hide-element mb-8 p-4 rounded-xl border opacity-0 transform translate-y-2">
                <div class="flex items-start gap-3">
                    <span id="desc-icon-wrapper" class="flex-shrink-0 mt-0.5 w-5 h-5 flex items-center justify-center">
                        <i data-lucide="info" class="w-5 h-5"></i>
                    </span>
                    <div class="w-full">
                        <h4 id="desc-title" class="font-semibold text-[#1B194D] text-base mb-3"></h4>
                        
                        <!-- Profil Type Box -->
                        <div id="profil-box" class="flex items-start gap-3 p-3 bg-white rounded-xl shadow-sm border border-white/50 mb-4">
                            <div id="profil-icon-bg" class="flex-shrink-0 p-1.5 rounded-lg">
                                <i data-lucide="user-check" class="w-4 h-4"></i>
                            </div>
                            <div>
                                <p class="text-[11px] font-bold text-[#A6A09B] uppercase tracking-wider mb-0.5">Profil idéal</p>
                                <p id="desc-profil-text" class="text-sm font-medium text-[#1B194D]"></p>
                            </div>
                        </div>

                        <div id="desc-text" class="text-[#57534D] text-sm leading-relaxed"></div>
                    </div>
                </div>
            </div>

            <!-- CTA Button -->
            <div id="cta-container" class="flex justify-center mt-6">
                <button 
                    id="cta-btn" 
                    class="w-full sm:w-auto min-w-[240px] bg-[#5A52FF] hover:bg-[#443EC1] text-white font-bold text-base py-3.5 px-6 rounded-xl transition-all duration-200 shadow-md hover:shadow-lg flex items-center justify-center gap-2 group opacity-40 pointer-events-none"
                >
                    <span>Voir l'offre !</span>
                    <i data-lucide="arrow-right" class="w-5 h-5 group-hover:translate-x-1 transition-transform"></i>
                </button>
            </div>
            
        </div>
    </div>
</div>

<!-- 4. Logique Interactive (JavaScript) -->
<script>
    if (typeof lucide !== 'undefined') { lucide.createIcons(); }

    const offers = [
        { 
            id: 'tarif-bleu', 
            name: "Tarif Bleu (Tarif Réglementé)", 
            url: "https://www.papernest.com/demarches-energie/edf/offres/tarif-bleu/", 
            type: "elec", 
            profil: "Tous types de logements. Parfait pour les consommateurs qui privilégient la sécurité et la prévisibilité de leur budget énergie.",
            description: "<ul class='list-disc pl-5 space-y-1.5'><li>Le tarif réglementé dont le prix est fixé et garanti par les pouvoirs publics (la CRE).</li><li>Offre une grande sécurité tarifaire pour votre budget.</li><li>Disponible au choix en option Base ou Heures Creuses.</li><li>Sans engagement de durée, résiliable à tout moment et sans frais.</li></ul>" 
        },
        { 
            id: 'heures-creuses', 
            name: "Option Heures Creuses", 
            url: "https://www.papernest.com/demarches-energie/edf/offres/heures-creuses/", 
            type: "elec", 
            profil: "Foyers équipés d'appareils programmables énergivores (chauffe-eau électrique, lave-linge, sèche-linge) ou possédant un véhicule électrique.",
            description: "<ul class='list-disc pl-5 space-y-1.5'><li>Bénéficiez d'un prix du kWh réduit 8 heures par jour (généralement la nuit).</li><li>Idéal pour rentabiliser vos grosses consommations électriques.</li><li>Permet de réaliser des économies en programmant et en décalant l'utilisation de vos appareils.</li></ul>" 
        },
        { 
            id: 'tempo', 
            name: "Option Tempo", 
            url: "https://www.papernest.com/demarches-energie/edf/offres/tempo/", 
            type: "elec", 
            profil: "Foyers disposant d'un mode de chauffage alternatif (bois, poêle, insert) et capables de réduire leur consommation lors des jours de grand froid.",
            description: "<ul class='list-disc pl-5 space-y-1.5'><li>Prix du kWh variable selon 3 couleurs de jours (Bleu, Blanc, Rouge) et les heures (Pleines/Creuses).</li><li>Tarif extrêmement avantageux 343 jours par an.</li><li>Demande une forte flexibilité pour réduire sa consommation les 22 jours « Rouges » d'hiver.</li></ul>" 
        },
        { 
            id: 'vert-electrique', 
            name: "Vert Électrique", 
            url: "https://www.papernest.com/demarches-energie/edf/offres/vert-electrique/", 
            type: "elec", 
            profil: "Consommateurs soucieux de leur impact environnemental souhaitant soutenir la production d'énergies renouvelables.",
            description: "<ul class='list-disc pl-5 space-y-1.5'><li>Une offre d'électricité 100% verte certifiée par les Garanties d'Origine.</li><li>L'équivalent de votre consommation est injecté en énergie renouvelable sur le réseau par EDF.</li><li>Soutien direct à la transition énergétique, sans engagement.</li></ul>" 
        },
        { 
            id: 'zen', 
            name: "Zen Électrique", 
            url: "https://www.papernest.com/demarches-energie/edf/offres/zen/", 
            type: "elec", 
            profil: "Personnes actives souvent absentes en semaine, ou propriétaires de résidences secondaires consommant principalement le week-end.",
            description: "<ul class='list-disc pl-5 space-y-1.5'><li>Prix du kWh HT 30% moins cher le week-end et les jours fériés.</li><li>Offre spécialement conçue pour les modes de vie décalés ou les loisirs.</li><li>Nécessite impérativement un compteur communicant Linky.</li></ul>" 
        },
        { 
            id: 'tarif-jaune', 
            name: "Tarif Jaune (Professionnels)", 
            url: "https://www.papernest.com/demarches-energie/edf/offres/tarif-jaune/", 
            type: "pro", 
            profil: "PME, PMI, commerces et collectivités dont la puissance de compteur requise est comprise entre 42 kVA et 250 kVA.",
            description: "<ul class='list-disc pl-5 space-y-1.5'><li>Offre de marché sur-mesure pour les entreprises à moyenne puissance.</li><li>Structure tarifaire adaptée aux besoins spécifiques de l'activité professionnelle.</li><li>Accompagnement dédié par des conseillers EDF Entreprises.</li></ul>" 
        },
        { 
            id: 'tarif-vert', 
            name: "Tarif Vert (Professionnels)", 
            url: "https://www.papernest.com/demarches-energie/edf/offres/tarif-vert/", 
            type: "pro", 
            profil: "Grandes entreprises et sites industriels nécessitant une puissance de raccordement supérieure à 250 kVA (Haute Tension).",
            description: "<ul class='list-disc pl-5 space-y-1.5'><li>Contrat d'énergie optimisé pour les très grands volumes de consommation.</li><li>Raccordement direct au réseau de transport ou de distribution haute tension.</li><li>Gestion spécialisée et structure tarifaire complexe adaptée aux processus industriels.</li></ul>" 
        }
    ];

    const typeColors = {
        elec: { text: '#5A52FF', bg: '#F6F5FF', border: '#CECCFF', icon: 'zap' },
        pro: { text: '#02C5AE', bg: '#F3FCFB', border: '#B4EEE7', icon: 'building-2' },
        default: { text: '#A6A09B', bg: '#FAFAF9', border: '#E7E5E4', icon: 'layout-list' }
    };

    const groupedOffers = {
        "Offres Particuliers": offers.filter(o => o.type === 'elec'),
        "Offres Professionnels": offers.filter(o => o.type === 'pro')
    };

    const selectBtn = document.getElementById('select-btn');
    const selectText = document.getElementById('select-text');
    const selectIcon = document.getElementById('select-icon');
    const selectChevron = document.getElementById('select-chevron');
    const dropdownMenu = document.getElementById('dropdown-menu');
    const descContainer = document.getElementById('desc-container');
    const descTitle = document.getElementById('desc-title');
    const descProfilText = document.getElementById('desc-profil-text');
    const profilIconBg = document.getElementById('profil-icon-bg');
    const descText = document.getElementById('desc-text');
    const descIconWrapper = document.getElementById('desc-icon-wrapper');
    const ctaBtn = document.getElementById('cta-btn');

    let isOpen = false;
    let selectedOffer = null;

    // --- FONCTION DE RESIZE AMÉLIORÉE ---
    function sendResize() {
        const root = document.getElementById('papernest-edf-tool');
        const dropdown = document.getElementById('dropdown-menu');
        
        // On calcule la hauteur du contenu visible
        let height = root.scrollHeight || root.offsetHeight;
        
        // Si le menu déroulant est ouvert, on doit s'assurer que sa hauteur est comptée
        // car il est en position "absolute"
        if (isOpen && dropdown) {
            const dropdownRect = dropdown.getBoundingClientRect();
            const rootRect = root.getBoundingClientRect();
            const dropdownBottomRel = dropdownRect.bottom - rootRect.top;
            if (dropdownBottomRel > height) {
                height = dropdownBottomRel;
            }
        }

        window.parent.postMessage({
            type: 'papernest-tool-resize',
            height: height + 20 // Marge de confort
        }, '*');
    }

    // Utilisation d'un ResizeObserver pour détecter tout changement interne automatiquement
    const resizeObserver = new ResizeObserver(() => {
        sendResize();
    });
    resizeObserver.observe(document.getElementById('papernest-edf-tool'));

    function renderDropdown() {
        dropdownMenu.innerHTML = '';
        Object.entries(groupedOffers).forEach(([groupName, groupOffers]) => {
            if(groupOffers.length === 0) return;
            const groupDiv = document.createElement('div');
            groupDiv.className = 'mb-2 last:mb-0';
            const header = document.createElement('div');
            header.className = 'px-4 py-2 text-[10px] font-bold text-[#A6A09B] uppercase tracking-wider bg-white sticky top-0 z-10';
            header.innerText = groupName;
            groupDiv.appendChild(header);

            groupOffers.forEach(offer => {
                const theme = typeColors[offer.type];
                const item = document.createElement('div');
                item.className = 'offer-item flex items-center justify-between px-4 py-2.5 cursor-pointer transition-colors hover:bg-[#FAFAF9]';
                item.innerHTML = `<div class="flex items-center gap-3"><i data-lucide="${theme.icon}" class="w-4 h-4 item-icon text-[#A6A09B]"></i><span class="text-sm text-[#57534D] item-text">${offer.name}</span></div><i data-lucide="check" class="w-4 h-4 hide-element item-check" style="color: ${theme.text}"></i>`;
                item.onclick = (e) => { e.stopPropagation(); selectOffer(offer, item); closeDropdown(); };
                groupDiv.appendChild(item);
            });
            dropdownMenu.appendChild(groupDiv);
        });
        lucide.createIcons();
    }

    function toggleDropdown() {
        isOpen = !isOpen;
        if (isOpen) {
            dropdownMenu.classList.remove('hide-element');
            selectChevron.classList.add('rotate-180');
            selectBtn.classList.replace('border-[#CECCFF]', 'border-[#5A52FF]');
            selectBtn.classList.add('ring-1', 'ring-[#5A52FF]');
        } else {
            closeDropdown();
        }
    }

    function closeDropdown() {
        isOpen = false;
        dropdownMenu.classList.add('hide-element');
        selectChevron.classList.remove('rotate-180');
        if(!selectedOffer) {
            selectBtn.classList.replace('border-[#5A52FF]', 'border-[#CECCFF]');
            selectBtn.classList.remove('ring-1', 'ring-[#5A52FF]');
        }
    }

    function selectOffer(offer, itemElement) {
        selectedOffer = offer;
        const theme = typeColors[offer.type];
        selectText.innerText = offer.name;
        selectText.className = 'truncate text-[#1C1917] font-semibold';
        selectIcon.innerHTML = `<i data-lucide="${theme.icon}" class="w-4 h-4" style="color: ${theme.text}"></i>`;
        selectBtn.classList.remove('bg-[#F6F5FF]', 'hover:border-[#5A52FF]');
        selectBtn.classList.add('bg-white', 'border-[#5A52FF]', 'ring-1', 'ring-[#5A52FF]');
        selectChevron.classList.replace('text-[#5A52FF]', 'text-[#79716B]');

        descContainer.style.backgroundColor = theme.bg;
        descContainer.style.borderColor = theme.border;
        descTitle.innerText = offer.name;
        descProfilText.innerText = offer.profil;
        profilIconBg.style.backgroundColor = theme.bg;
        profilIconBg.style.color = theme.text;
        descText.innerHTML = offer.description;
        descIconWrapper.innerHTML = `<i data-lucide="info" class="w-5 h-5" style="color: ${theme.text}"></i>`;
        descContainer.classList.remove('hide-element');
        setTimeout(() => descContainer.classList.remove('opacity-0', 'translate-y-2'), 10);

        ctaBtn.classList.remove('opacity-40', 'pointer-events-none');
        lucide.createIcons();
    }

    selectBtn.onclick = (e) => { e.stopPropagation(); toggleDropdown(); };
    document.onclick = (e) => { if (isOpen && !document.getElementById('dropdown-container').contains(e.target)) closeDropdown(); };
    ctaBtn.onclick = () => { if (selectedOffer) window.open(selectedOffer.url, '_blank'); };

    window.onload = () => {
        renderDropdown();
    };
</script>
