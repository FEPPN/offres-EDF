<!-- 1. Importation de Tailwind CSS et Lucide Icons -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<!-- 2. Styles encapsulés pour ne pas casser le reste de votre site -->
<style>
    @font-face {
        font-family: 'Avenir';
        src: local('Avenir'), local('Avenir-Light');
    }
    #papernest-edf-tool {
        font-family: 'Avenir', system-ui, -apple-system, sans-serif;
        background-color: transparent;
        width: 100%;
    }
    #papernest-edf-tool .hide-element { 
        display: none !important; 
    }
    #papernest-edf-tool #dropdown-menu::-webkit-scrollbar {
        width: 6px;
    }
    #papernest-edf-tool #dropdown-menu::-webkit-scrollbar-thumb {
        background-color: #E7E5E4;
        border-radius: 10px;
    }
</style>

<!-- 3. Structure de l'outil (HTML) -->
<div id="papernest-edf-tool" class="text-[#1C1917] antialiased">
    <div class="flex flex-col items-center justify-center py-6 w-full">
        
        <!-- Main Title -->
        <h1 class="text-lg md:text-xl font-bold mb-8 text-center tracking-tight">
            Trouvez votre offre d'électricité EDF
        </h1>

        <!-- Main Card -->
        <div class="bg-white rounded-[24px] w-full max-w-4xl border border-[#E7E5E4] p-6 md:p-10 shadow-sm mx-auto">
            
            <p class="text-[#57534D] text-sm md:text-base mb-8 text-left">
                Consultez les détails de chaque offre d'électricité et trouvez celle qui correspond le mieux à votre logement et à vos habitudes de consommation.
            </p>

            <!-- Form Body -->
            <div class="mb-8 relative" id="dropdown-container">
                <label class="block text-sm font-semibold mb-3">
                    Sélectionnez une offre
                </label>
                
                <!-- Custom Select Box -->
                <div id="select-btn" class="w-full bg-white border border-[#E7E5E4] hover:border-[#D6D3D1] text-sm py-3 px-4 rounded-xl transition-all font-medium cursor-pointer flex items-center justify-between">
                    <div class="flex items-center gap-3 truncate pr-4">
                        <span id="select-icon" class="text-[#A6A09B] flex-shrink-0 flex items-center justify-center w-4 h-4">
                            <i data-lucide="layout-list" class="w-4 h-4"></i>
                        </span>
                        <span id="select-text" class="text-[#79716B] truncate">Sélectionner une offre...</span>
                    </div>
                    <i data-lucide="chevron-down" id="select-chevron" class="w-4 h-4 text-[#79716B] flex-shrink-0 transition-transform duration-200"></i>
                </div>

                <!-- Dropdown Options -->
                <div id="dropdown-menu" class="hide-element absolute z-50 w-full mt-2 bg-white border border-[#E7E5E4] rounded-xl shadow-lg max-h-[280px] overflow-y-auto py-2">
                    <!-- Les options seront injectées ici par JavaScript -->
                </div>
            </div>

            <!-- Offer Description Area -->
            <div id="desc-container" class="hide-element mb-8 p-4 rounded-xl border transition-all duration-300 opacity-0 transform translate-y-2">
                <div class="flex items-start gap-3">
                    <span id="desc-icon-wrapper" class="flex-shrink-0 mt-0.5 w-5 h-5 flex items-center justify-center">
                        <i data-lucide="info" class="w-5 h-5"></i>
                    </span>
                    <div class="w-full">
                        <h4 id="desc-title" class="font-semibold text-[#1B194D] text-base mb-3"></h4>
                        
                        <!-- Profil Type Box -->
                        <div class="flex items-start gap-3 p-3 bg-white rounded-xl shadow-sm border border-white/50 mb-4">
                            <div class="flex-shrink-0 bg-[#F6F5FF] p-1.5 rounded-lg text-[#5A52FF]">
                                <i data-lucide="user-check" class="w-4 h-4"></i>
                            </div>
                            <div>
                                <p class="text-[11px] font-bold text-[#A6A09B] uppercase tracking-wider mb-0.5">Profil idéal</p>
                                <p id="desc-profil-text" class="text-sm font-medium text-[#1B194D]"></p>
                            </div>
                        </div>

                        <div id="desc-text" class="text-[#57534D] text-sm leading-relaxed"></div>
                    </div>
                </div>
            </div>

            <!-- CTA Button (Utilisation stricte du composant fourni) -->
            <div id="cta-container" class="flex justify-center mt-4 hide-element">
                <ppn-cta 
                    id="cta-btn" 
                    call-text="Voir l'offre !"
                ></ppn-cta>
            </div>
            
        </div>
    </div>
</div>

<!-- 4. Logique Interactive (JavaScript) -->
<script>
    // Initialisation des icônes Lucide
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }

    const offers = [
        { 
            id: 'tarif-bleu', 
            name: "Tarif Bleu (Tarif Réglementé)", 
            url: "https://www.papernest.com/demarches-energie/edf/offres/tarif-bleu/", 
            type: "elec", 
            profil: "Tous types de logements. Parfait pour les consommateurs qui privilégient la sécurité et la prévisibilité de leur budget énergie.",
            description: "<ul class='list-disc pl-5 space-y-1.5'><li>Le tarif réglementé dont le prix est fixé et garanti par les pouvoirs publics (la CRE).</li><li>Offre une grande sécurité tarifaire pour votre budget.</li><li>Disponible au choix en option Base ou Heures Creuses.</li><li>Sans engagement de durée, résiliable à tout moment et sans frais.</li></ul>" 
        },
        { 
            id: 'heures-creuses', 
            name: "Option Heures Creuses", 
            url: "https://www.papernest.com/demarches-energie/edf/offres/heures-creuses/", 
            type: "elec", 
            profil: "Foyers équipés d'appareils programmables très énergivores (chauffe-eau électrique, lave-linge, sèche-linge) ou possédant un véhicule électrique.",
            description: "<ul class='list-disc pl-5 space-y-1.5'><li>Bénéficiez d'un prix du kWh réduit 8 heures par jour (généralement la nuit et/ou en milieu de journée).</li><li>Idéal pour rentabiliser vos grosses consommations électriques.</li><li>Permet de réaliser des économies en programmant et en décalant l'utilisation de vos appareils.</li></ul>" 
        },
        { 
            id: 'tempo', 
            name: "Option Tempo", 
            url: "https://www.papernest.com/demarches-energie/edf/offres/tempo/", 
            type: "elec", 
            profil: "Foyers disposant d'un mode de chauffage alternatif (bois, poêle, insert) et capables de réduire drastiquement leur consommation électrique les jours de grand froid.",
            description: "<ul class='list-disc pl-5 space-y-1.5'><li>Le prix du kWh varie selon 3 couleurs de jours (Bleu, Blanc, Rouge) et les heures (Pleines/Creuses).</li><li>Tarif très économique 343 jours par an.</li><li>Demande une forte flexibilité pour réduire fortement sa consommation les 22 jours « Rouges » d'hiver.</li></ul>" 
        },
        { 
            id: 'ejp', 
            name: "Option EJP", 
            url: "https://www.papernest.com/demarches-energie/edf/offres/ejp/", 
            type: "elec", 
            profil: "Anciens clients capables de fortement diminuer leur consommation 22 jours par an en hiver (offre historique non disponible à la souscription).",
            description: "<ul class='list-disc pl-5 space-y-1.5'><li>Option historique offrant un tarif très avantageux 343 jours par an.</li><li>En contrepartie, le prix du kWh est nettement plus élevé pendant les 22 jours d'Effacement Jour de Pointe (EJP) répartis entre novembre et mars.</li><li><em>Note importante : cette offre n'est plus ouverte à la souscription pour les nouveaux clients EDF.</em></li></ul>" 
        },
        { 
            id: 'vert-electrique', 
            name: "Vert Électrique", 
            url: "https://www.papernest.com/demarches-energie/edf/offres/vert-electrique/", 
            type: "elec", 
            profil: "Consommateurs soucieux de leur impact environnemental et souhaitant soutenir financièrement la production d'énergies renouvelables.",
            description: "<ul class='list-disc pl-5 space-y-1.5'><li>Une offre d'électricité 100% verte certifiée par le mécanisme des Garanties d'Origine.</li><li>Pour chaque kWh que vous consommez, l'équivalent en énergie renouvelable (éolien, solaire, hydraulique) est injecté sur le réseau.</li><li>Vous participez activement à la transition énergétique, le tout sans engagement.</li></ul>" 
        },
        { 
            id: 'zen', 
            name: "Zen Électrique", 
            url: "https://www.papernest.com/demarches-energie/edf/offres/zen/", 
            type: "elec", 
            profil: "Personnes actives souvent absentes la semaine, ou propriétaires de résidences secondaires consommant principalement le week-end.",
            description: "<ul class='list-disc pl-5 space-y-1.5'><li>Profitez d'un prix du kWh HT 30% moins cher le week-end et les jours fériés par rapport aux autres jours de la semaine.</li><li>Offre spécialement conçue pour ceux qui consomment majoritairement en fin de semaine.</li><li>Nécessite d'être équipé d'un compteur communicant Linky.</li></ul>" 
        }
    ];

    const typeColors = {
        elec: { text: '#5A52FF', bg: '#F6F5FF', border: '#CECCFF', icon: 'zap' },
        default: { text: '#A6A09B', bg: '#FAFAF9', border: '#E7E5E4', icon: 'layout-list' }
    };

    const groupedOffers = {
        "Offres Électricité": offers.filter(o => o.type === 'elec')
    };

    // DOM Elements
    const selectBtn = document.getElementById('select-btn');
    const selectText = document.getElementById('select-text');
    const selectIcon = document.getElementById('select-icon');
    const selectChevron = document.getElementById('select-chevron');
    const dropdownMenu = document.getElementById('dropdown-menu');
    const descContainer = document.getElementById('desc-container');
    const descTitle = document.getElementById('desc-title');
    const descProfilText = document.getElementById('desc-profil-text');
    const descText = document.getElementById('desc-text');
    const descIconWrapper = document.getElementById('desc-icon-wrapper');
    const ctaContainer = document.getElementById('cta-container');
    const ctaBtn = document.getElementById('cta-btn');

    let isOpen = false;
    let selectedOffer = null;

    // Fonction pour peupler le menu déroulant
    function renderDropdown() {
        Object.entries(groupedOffers).forEach(([groupName, groupOffers]) => {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'mb-2 last:mb-0';

            const header = document.createElement('div');
            header.className = 'px-4 py-2 text-[10px] font-bold text-[#A6A09B] uppercase tracking-wider bg-white sticky top-0 z-10';
            header.innerText = groupName;
            groupDiv.appendChild(header);

            groupOffers.forEach(offer => {
                const theme = typeColors[offer.type];
                const item = document.createElement('div');
                item.className = 'offer-item flex items-center justify-between px-4 py-2.5 cursor-pointer transition-colors hover:bg-[#FAFAF9]';
                item.dataset.id = offer.id;
                
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <i data-lucide="${theme.icon}" class="w-4 h-4 item-icon text-[#A6A09B]"></i>
                        <span class="text-sm text-[#57534D] item-text">${offer.name}</span>
                    </div>
                    <i data-lucide="check" class="w-4 h-4 hide-element item-check" style="color: ${theme.text}"></i>
                `;

                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectOffer(offer, item);
                    closeDropdown();
                });

                groupDiv.appendChild(item);
            });
            dropdownMenu.appendChild(groupDiv);
        });
        
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    }

    function toggleDropdown() {
        isOpen = !isOpen;
        if (isOpen) {
            dropdownMenu.classList.remove('hide-element');
            selectChevron.classList.add('rotate-180');
            if(!selectedOffer) {
                selectBtn.classList.replace('border-[#E7E5E4]', 'border-[#5A52FF]');
                selectBtn.classList.add('ring-1', 'ring-[#5A52FF]');
            }
        } else {
            closeDropdown();
        }
    }

    function closeDropdown() {
        isOpen = false;
        dropdownMenu.classList.add('hide-element');
        selectChevron.classList.remove('rotate-180');
        if(!selectedOffer) {
            selectBtn.classList.replace('border-[#5A52FF]', 'border-[#E7E5E4]');
            selectBtn.classList.remove('ring-1', 'ring-[#5A52FF]');
        }
    }

    function selectOffer(offer, itemElement) {
        selectedOffer = offer;
        const theme = typeColors[offer.type];

        // 1. Mettre à jour le bouton Select
        selectText.innerText = offer.name;
        selectText.className = 'truncate text-[#1C1917] font-semibold';
        selectIcon.innerHTML = `<i data-lucide="${theme.icon}" class="w-4 h-4" style="color: ${theme.text}"></i>`;
        
        selectBtn.classList.replace('border-[#E7E5E4]', 'border-[#5A52FF]');
        selectBtn.classList.add('ring-1', 'ring-[#5A52FF]');

        // 2. Mettre à jour la description et le profil type
        descContainer.style.backgroundColor = theme.bg;
        descContainer.style.borderColor = theme.border;
        descTitle.innerText = offer.name;
        descProfilText.innerText = offer.profil;
        descText.innerHTML = offer.description;
        descIconWrapper.innerHTML = `<i data-lucide="info" class="w-5 h-5" style="color: ${theme.text}"></i>`;
        
        descContainer.classList.remove('hide-element');
        // Animation fade in
        setTimeout(() => {
            descContainer.classList.remove('opacity-0', 'translate-y-2');
            descContainer.classList.add('opacity-100', 'translate-y-0');
        }, 10);

        // 3. Afficher le bouton CTA
        ctaContainer.classList.remove('hide-element');

        // 4. Mettre à jour les couleurs dans la liste déroulante
        document.querySelectorAll('.offer-item').forEach(el => {
            el.style.backgroundColor = '';
            el.classList.add('hover:bg-[#FAFAF9]');
            el.querySelector('.item-text').classList.replace('text-[#1B194D]', 'text-[#57534D]');
            el.querySelector('.item-text').classList.remove('font-semibold');
            el.querySelector('.item-icon').style.color = '#A6A09B';
            el.querySelector('.item-check').classList.add('hide-element');
        });

        if (itemElement) {
            itemElement.style.backgroundColor = theme.bg;
            itemElement.classList.remove('hover:bg-[#FAFAF9]');
            itemElement.querySelector('.item-text').classList.replace('text-[#57534D]', 'text-[#1B194D]');
            itemElement.querySelector('.item-text').classList.add('font-semibold');
            itemElement.querySelector('.item-icon').style.color = theme.text;
            itemElement.querySelector('.item-check').classList.remove('hide-element');
        }

        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    }

    // Event Listeners
    selectBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleDropdown();
    });

    document.addEventListener('click', (e) => {
        if (isOpen && !document.getElementById('dropdown-container').contains(e.target)) {
            closeDropdown();
        }
    });

    ctaBtn.addEventListener('click', () => {
        if (selectedOffer && selectedOffer.url) {
            window.open(selectedOffer.url, '_blank');
        }
    });

    // Initialize
    renderDropdown();

</script>
